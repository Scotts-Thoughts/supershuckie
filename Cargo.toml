[workspace]
members = [
    "supershuckie-core",
    "supershuckie-pokeabyte-integration",
    "supershuckie-replay-recorder",
    "supershuckie-frontend",
    "supershuckie-frontend-c",
    "melonds-rs",
    "mgba-rs",
    "azahar-rs",
    "supershuckie-frontend-webserver",
    "supershuckie-memory-tools",
    "supershuckie-frame-server",
    "supershuckie-play-together"
]

resolver = "3"

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.89.0"

[workspace.dependencies]
# Workspace crates; their version is [workspace.package] above.
supershuckie-replay-recorder = { path = "supershuckie-replay-recorder" }
supershuckie-pokeabyte-integration = { path = "supershuckie-pokeabyte-integration" }
supershuckie-frontend-webserver = { path = "supershuckie-frontend-webserver" }
supershuckie-core = { path = "supershuckie-core" }
supershuckie-frontend = { path = "supershuckie-frontend" }
melonds-rs = { path = "melonds-rs" }
mgba-rs = { path = "mgba-rs" }
azahar-rs = { path = "azahar-rs" }
supershuckie-memory-tools = { path = "supershuckie-memory-tools" }
supershuckie-frame-server = { path = "supershuckie-frame-server" }
supershuckie-play-together = { path = "supershuckie-play-together" }

num_enum = "0.7.5"
tinyvec = { version = "1.10.0", features = ["alloc"], default-features = false }
spin = "0.10.0"
zstd-sys = { version = "2.0.16", default-features = false }
blake3 = "1.8.2"
cc = "1.2.46"
byteorder = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }
safeboy = "0.3.0-beta.6"
serde_json = "1.0.145"
memmap2 = "0.9"

# safeboy with the slave side of SameBoy's serial API, which the link cable between two cores
# needs; see third-party/safeboy/patches. Drop once a release carries the patch.
[patch.crates-io]
safeboy = { path = "third-party/safeboy" }

[profile.release]
lto = true
opt-level = 3
panic = "abort"
