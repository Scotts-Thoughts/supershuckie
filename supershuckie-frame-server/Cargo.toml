[package]
name = "supershuckie-frame-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Serves composited frames and audio of a Super Shuckie replay to another program over stdin/stdout"

[[bin]]
name = "supershuckie-frame-server"
path = "src/main.rs"

[dependencies]
supershuckie-core = { workspace = true }
supershuckie-replay-recorder = { workspace = true }
serde_json = { workspace = true }
# `dup2`, to point descriptor 1 at stderr once the protocol has claimed the real stdout.
libc = "0.2"
